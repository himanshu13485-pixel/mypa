# Reverb WebSocket proxy for netvork.app (Apache userdata include).
# Install to BOTH:
#   /etc/apache2/conf.d/userdata/ssl/2_4/netvork/netvork.app/websocket.conf
#   /etc/apache2/conf.d/userdata/std/2_4/netvork/netvork.app/websocket.conf
# then: /scripts/rebuildhttpdconf && systemctl restart httpd
# Requires mod_proxy + mod_proxy_wstunnel (compiled into EA4 by default).

ProxyPreserveHost On
ProxyPass        /app ws://127.0.0.1:8080/app
ProxyPassReverse /app ws://127.0.0.1:8080/app
