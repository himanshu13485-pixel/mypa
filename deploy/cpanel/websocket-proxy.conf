# NOT IN USE — kept only as a record of an alternative setup.
#
# Netvork runs Reverb with its own TLS on 0.0.0.0:8443 (REVERB_SERVER_PORT and
# REVERB_TLS_CERT/KEY in backend/.env, certificate refreshed weekly by
# refresh-ssl.sh). Browsers connect straight to wss://netvork.app:8443 — that
# port is compiled into the frontend build.
#
# The config below belongs to a different design: Reverb plain on 127.0.0.1:8080
# behind an Apache /app proxy on 443. Do not install it alongside the current
# setup. On 2026-08-04 the two were mixed — the systemd unit forced Reverb onto
# plain 8080 while browsers and PHP both addressed 8443 — and every meeting
# join, call and chat broadcast failed with a 500 until the flags were removed.
#
# If you ever do switch to the proxy design, all of these have to move together:
#   - remove --host/--port overrides so REVERB_SERVER_PORT=8080 applies
#   - clear REVERB_TLS_CERT / REVERB_TLS_KEY
#   - set REVERB_INTERNAL_PORT=8080 and REVERB_INTERNAL_SCHEME=http
#   - rebuild the frontend with VITE_REVERB_PORT=443
#
# ---------------------------------------------------------------------------
# Install to BOTH:
#   /etc/apache2/conf.d/userdata/ssl/2_4/<user>/netvork.app/websocket.conf
#   /etc/apache2/conf.d/userdata/std/2_4/<user>/netvork.app/websocket.conf
# then: /scripts/rebuildhttpdconf && systemctl restart httpd
# Requires mod_proxy + mod_proxy_wstunnel (compiled into EA4 by default).
#
# ProxyPreserveHost On
# ProxyPass        /app ws://127.0.0.1:8080/app
# ProxyPassReverse /app ws://127.0.0.1:8080/app
